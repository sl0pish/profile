<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio Bootstrap</title>
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪷</text></svg>">

  <!-- Bootstrap CSS CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body{
      background-color: #F2EAE0;
    }
    nav, footer{
      background-color: #e89c9c;
      color: #602b2b;
    }
    
    a{
      color: #3d1a1a;
      cursor: pointer;
    }
    a:hover{
      color: #602b2b;
    }

    


       .form-container {
           max-width: 700px;
           background: #804444;
           padding: 40px;
           border-radius: 8px ;
           box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
       }

       .form-container h2{
        color: #ebb6b6;
       }
       


       .form-label {
           font-weight: 700;
           color: #ffeaea;
           font-size: 0.9rem;
       }
       .form-container input{
        background-color: #ffeaea;
        border: #9d5e5e 1px dashed;
       }

       .btn-enviar {
           background-color: #b67b7b;
           border: #9d5e5e 1px solid;
           padding: 10px 30px;
           border-radius: 10px;
           
       }

       .btn-enviar:hover {
           background-color: #7b4646;
           border: #612828 1px solid;
           padding: 10px 30px;
           border-radius: 10px;
           
       }


       .form-check-label {
           font-weight: 600;
           color: #ffffff;
       }

    
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">

    

      <!-- Botão hamburguer -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menu -->
      <div class="collapse navbar-collapse" id="menu">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active" href="curriculum.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="portifolio.html">Portfólio</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Contato</a>
          </li>

         

        <!-- Notificações -->
        <div class="dropdown">

          <button
            class="btn btn-outline-light position-relative dropdown-toggle"
            data-bs-toggle="dropdown"
          >
            🔔

            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            >
              99+
            </span>

          </button>

          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Mensagem 1</a></li>
            <li><a class="dropdown-item" href="#">Mensagem 2</a></li>
            <li><a class="dropdown-item" href="#">Mensagem 3</a></li>
          </ul>

        </div>

      </div>
    </div>
  </nav>

  <!-- CONTEÚDO -->
  <main class="container d-flex justify-content-center">
       <div class="form-container w-100 mt-3">
           <h2 class="text-center mb-4" style="font-weight: 700;">Formulário para Contato</h2>


           <form>
               <div class="row g-3 mb-3">
                   <div class="col-md-6">
                       <label for="firstName" class="form-label">Primeiro Nome:</label>
                       <input type="text" class="form-control" id="firstName">
                   </div>
                   <div class="col-md-6">
                       <label for="lastName" class="form-label">Último Nome:</label>
                       <input type="text" class="form-control" id="lastName">
                   </div>
               </div>


               <div class="mb-3">
                   <label for="email" class="form-label">E-mail:</label>
                   <input type="email" class="form-control" id="email">
               </div>


               <div class="mb-3">
                   <label for="points" class="form-label">Pontos de interesse: </label>
                   <textarea class="form-control" id="points" rows="4"></textarea>
               </div>


              <div class="mb-4">
                   <label for="commentSite" class="form-label"> Avalie meu site pessoal:</label>
                    <a href="https://sl0p.neocities.org/" target="_blank">Meu Site</a>
                   <textarea class="form-control" id="commentSite" rows="1"></textarea>
               </div>



               <div class="mb-4">
                   <label for="comment" class="form-label">Adicione um comentário:</label>
                   <textarea class="form-control" id="comment" rows="3"></textarea>
               </div>


               <div class="text-center">
                   <button onclick="enviarEmail()" class="btn btn-primary btn-enviar">
                       <i class="bi bi-send-fill me-2"></i> Enviar
                   </button>
               </div>
           </form>
       </div>
   </main>
  <!-- FOOTER -->
  <footer class=" mt-5 p-4">

    <div class="container">

      <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-center"
      >

        <div>
          <h4>Informações para Contato</h4>

          <p class="mb-1">📧 issoeumtesteyey@email.com</p>
          <p class="mb-1">📱 (14) 99183-3715</p>
        </div>

        <div class="mt-3 mt-md-0">
          <p class="mb-0">
            © 2026 - Currículo simples com Bootstrap
          </p>
        </div>

      </div>

    </div>

  </footer>
<script>
       function enviarEmail() {
   const firstName = document.getElementById('firstName').value;
   const secondName = document.getElementById('lastName').value;
   const email = document.getElementById('email').value;
   const points = document.getElementById('points').value;
   const siteComentario = document.getElementById('commentSite').value;
   const comment = document.getElementById('comment').value;


   if (!firstName || !secondName || !email || !points || !siteComentario || !comment) {
       alert("Por favor, preencha todos os campos antes de enviar.");
       return;
   }


   const emailDestino = "issoeumtesteyey@gmail.com";
   const assunto = encodeURIComponent(`Proposta de Vaga: ${points}`);
   const corpoEmail = encodeURIComponent(`Olá, meu nome é ${firstName}.\n\nMensagem/Proposta:\n${comment}`);


   const urlGmail = `https://mail.google.com/mail/?view=cm&fs=1&to=${emailDestino}&su=${assunto}&body=${corpoEmail}`;




   window.open(urlGmail, '_blank');
}
   </script>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
